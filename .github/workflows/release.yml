name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v2.4.0)'
        required: true
      ref:
        description: 'Branch or commit to build from'
        required: false
        default: 'main'

permissions:
  contents: write

jobs:
  release:
    name: Build signed APKs & publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > apps.keystore

      - name: Create keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=../apps.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed release APK
        run: ./gradlew assembleNormalRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/normal/release/*.apk release-apks/ 2>/dev/null || true
          ls -la release-apks/

      - name: Update README version
        run: |
          # Version from the tag, with any leading "v" stripped (v2.4.0 -> 2.4.0).
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"
          # Rewrite the first table cell on the data row under the Version header.
          # Anchored on the "[![Discord]" badge so it only ever matches that one row,
          # never the "| Version |" header or the "|----|" separator.
          perl -0pi -e "s/\|\s*[^|]*?\s*\|(\s*\[!\[Discord\])/| ${VERSION} |\$1/" README.md
          # Fail loudly if the version cell is not now exactly the release version —
          # a silent no-match must not be mistaken for "already up to date".
          if ! grep -qE "^\|\s*${VERSION}\s*\|\s*\[!\[Discord\]" README.md; then
            echo "::error::README version cell was not updated to ${VERSION}. Check the Version table format in README.md."
            exit 1
          fi
          if git diff --quiet README.md; then
            echo "README version already up to date ($VERSION)."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "Update README version to ${VERSION}"
            git push origin HEAD:${{ github.event.inputs.ref }}
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.event.inputs.ref }}
          body_path: .github/RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: release-apks/*.apk
